```

## Recommended Protection Rules for `main` Branch

### Required Settings

| Setting | Value | Reason |
|---------|-------|--------|
| **Require pull request reviews** | ✅ 1 approval | Code review required before merge |
| **Dismiss stale reviews** | ✅ Enabled | Remove approval if new commits pushed |
| **Require code owner reviews** | ✅ Enabled | Enforce CODEOWNERS file |
| **Restrict who can dismiss reviews** | ✅ Enabled (maintainers) | Only senior devs can override |
| **Require status checks to pass** | ✅ All 3 CI jobs | CI must pass (Backend, Student, Teacher) |
| **Require branches to be up to date** | ✅ Enabled (strict) | Rebase onto latest main before merge |
| **Restrict who can push** | ✅ Maintainers only | Prevent direct pushes to main |
| **Allow force pushes** | ❌ Disabled | Prevent history rewrite |
| **Allow deletions** | ❌ Disabled | Prevent accidental branch deletion |
| **Include administrators** | ❌ Disabled | Admins follow same rules |
| **Require conversation resolution** | ⚠️ Optional | Mark all PR conversations resolved |

### Branch Name Pattern

Apply rule to: `main`

### Optional: Also protect `release/*` branches

Create a second rule:
- Branch name pattern: `release/*`
- Same settings as above
- Allow maintainers to bypass (for urgent fixes)

## Status Check Contexts

The following CI jobs must pass (from `.github/workflows/ci.yml`):

1. `Backend (Python FastAPI)` - Backend quality checks (Ruff, Black, MyPy, pytest)
2. `Student Portal (Next.js)` - Frontend quality checks (ESLint, Prettier, TypeScript, Jest, Build)
3. `Teacher Portal (Next.js)` - Frontend quality checks

Make sure these job names match exactly what's in your CI workflow.

## CODEOWNERS File

Create `.github/CODEOWNERS` to auto-request reviewers:

```
# Backend
/backend-python/ @your-username @backend-team

# Student Portal
/student-portal/ @your-username @frontend-team

# Teacher Portal
/teacher-portal/ @your-username @frontend-team

# Root files
/*.md @your-username
/.github/ @your-username
```

This automatically requests review from specified users/teams when PR touches those paths.

## Post-Apply Verification

After applying branch protection:

1. Try pushing directly to `main` - should be rejected
2. Open a PR from a feature branch
3. Verify that:
   - Required reviewers are auto-requested (from CODEOWNERS)
   - All 3 CI checks must pass before merge
   - "Require review" is enforced
   - "Update branch" button appears if main has new commits
4. Try merging without approval - should be blocked
5. Approve and merge - should succeed

## Troubleshooting

**Q: CI checks not appearing as required status checks?**
A: Make sure the job names in your protection rule exactly match the `name:` field in your CI workflow YAML.

**Q: CODEOWNERS not requesting reviewers?**
A: Check that the file is at `.github/CODEOWNERS` (not `CODEOWNERS` in root). Path patterns must match PR changed files.

**Q: Can't push to protected branch even though I'm admin?**
A: By default, admins are not exempt. Edit the rule and enable "Include administrators" if needed.

**Q: Branch protection API returns 422 error?**
A: Check that you have admin permissions on the repo and that the branch exists.

