# Branch Protection Rules Configuration

This file contains the recommended branch protection rules for the NextGenTra LMS repository.

## How to Apply

### Option 1: Manual Setup via GitHub UI (Recommended)

1. Go to your repository on GitHub
2. Click **Settings** → **Branches**
3. Click **Add rule** under "Branch protection rules"
4. Configure as shown below

### Option 2: Using GitHub CLI

```bash
# Install GitHub CLI if not already installed
# https://cli.github.com/

# Authenticate
gh auth login

# Apply branch protection for main branch
gh api \
  --method PUT \
  -H "Accept: application/vnd.github+json" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  /repos/:owner/:repo/branches/main/protection \
  -f branch_protection_rule='{
    "required_pull_request_reviews": {
      "required_approving_review_count": 1,
      "dismiss_stale_reviews": true,
      "require_code_owner_reviews": true,
      "restrict_bans": false
    },
    "enforce_admins": false,
    "required_status_checks": {
      "strict": true,
      "contexts": [
        "Backend (Python FastAPI)",
        "Student Portal (Next.js)",
        "Teacher Portal (Next.js)"
      ]
    },
    "restrictions": null,
    "allow_force_pushes": false,
    "allow_deletions": false,
    "block_creations": false,
    "required_conversation_resolution": false,
    "lock_branch": false,
    "allow_fork_syncing": false
  }'
```

Replace `:owner` and `:repo` with your GitHub org/repo.

### Option 3: Using GitHub API with Personal Access Token

