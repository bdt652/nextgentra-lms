name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextgentra
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: |
          cd backend-python
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/nextgentra" > .env
          echo "${{ github.workspace }}/backend-python/venv/bin" >> $GITHUB_PATH

      - name: Generate Prisma client
        run: |
          cd backend-python
          npx prisma@5.18.0 generate --schema prisma/schema.prisma

      - name: Apply database schema
        run: |
          cd backend-python
          npx prisma@5.18.0 db push --schema prisma/schema.prisma

      - name: Run Ruff linter
        run: |
          cd backend-python
          ruff check .

      - name: Run Black formatter check
        run: |
          cd backend-python
          black --check .

      - name: Run MyPy type checking
        run: |
          cd backend-python
          mypy app/

      - name: Run tests with pytest
        run: |
          cd backend-python
          export PYTHONPATH=$(pwd)
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend-python/coverage.xml
          flags: backend
          name: backend-coverage
        if: always()

  student-portal:
    name: Student Portal (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: student-portal/package-lock.json

      - name: Install dependencies
        run: |
          cd student-portal
          npm ci

      - name: Run ESLint
        run: |
          cd student-portal
          npm run lint

      - name: Run Prettier check
        run: |
          cd student-portal
          npm run format:check

      - name: Run TypeScript type check
        run: |
          cd student-portal
          npm run type-check

      - name: Run tests with Jest
        run: |
          cd student-portal
          npm test -- --ci --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./student-portal/coverage/coverage-final.json
          flags: student-portal
          name: student-portal-coverage
        if: always()

      - name: Run build
        run: |
          cd student-portal
          npm run build

  teacher-portal:
    name: Teacher Portal (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: teacher-portal/package-lock.json

      - name: Install dependencies
        run: |
          cd teacher-portal
          npm ci

      - name: Run ESLint
        run: |
          cd teacher-portal
          npm run lint

      - name: Run Prettier check
        run: |
          cd teacher-portal
          npm run format:check

      - name: Run TypeScript type check
        run: |
          cd teacher-portal
          npm run type-check

      - name: Run tests with Jest
        run: |
          cd teacher-portal
          npm test -- --ci --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./teacher-portal/coverage/coverage-final.json
          flags: teacher-portal
          name: teacher-portal-coverage
        if: always()

      - name: Run build
        run: |
          cd teacher-portal
          npm run build